# Pages CMS 配置 —— https://pagescms.org
#
# 作用：给不熟悉 Markdown / Git 的组员一个表单式的编辑后台。
# 用法（一次性设置，约 3 分钟）：
#   1. 由 UEM-YJLAB 组织所有者批准 Pages CMS GitHub App 访问本仓库
#   2. 成员用各自的 GitHub 账号登录 https://app.pagescms.org
#   3. 选择 UEM-YJLAB/YJlabwiki（需要对应仓库写权限）
#   4. 选择「世代编年史 / 组别 / 帮助页面」填写保存
# 配置文件不会自动安装或授权 GitHub App；这是一个可选的编辑方式。
#
# 保存即提交，站点会自动重建。无需任何服务器。

media:
  - name: images
    label: 图片
    input: docs/public/images
    output: /images

content:
  - name: chronicle
    label: 世代编年史
    type: collection
    path: docs/chronicle
    filename: '{fields.slug}.md'
    view:
      fields: [title, order]
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true
      - name: slug
        label: 文件名（英文短横线，如 gen-4）
        type: string
        required: true
      - name: categories
        label: 分类
        type: select
        list: true
        options:
          values:
            - 世代编年史
      - name: body
        label: 正文
        type: rich-text

  - name: groups
    label: 组别
    type: collection
    path: docs/groups
    filename: '{fields.slug}.md'
    view:
      fields: [title]
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true
      - name: slug
        label: 文件名（英文短横线，如 vision）
        type: string
        required: true
      - name: categories
        label: 分类
        type: select
        list: true
        options:
          values:
            - 组别
      - name: body
        label: 正文
        type: rich-text

  - name: help
    label: 帮助页面
    type: collection
    path: docs/help
    filename: '{fields.slug}.md'
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true
      - name: slug
        label: 文件名（英文短横线）
        type: string
        required: true
      - name: body
        label: 正文
        type: rich-text
