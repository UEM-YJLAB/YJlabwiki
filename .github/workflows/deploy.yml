name: 部署到 GitHub Pages

# 任何时候有人往 main 提交（包括在网页上点「编辑」改完 Markdown 后提交），
# 这个工作流就会重新构建并发布站点。通常 1 分钟内生效。

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动触发

# 默认只读；发布权限仅授予 deploy 作业。
permissions:
  contents: read

# 同一时间只跑一个部署，避免并发互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7.0.1
        with:
          # 必须完整历史：页脚的「本页面最后修订于」是靠 git 提交时间算的
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: 构建站点
        run: npm run build
        env:
          # 从 Pages 实际配置取得子路径；迁移组织或绑定域名时无需再手工改路径。
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v5.0.1
